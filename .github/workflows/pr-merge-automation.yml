name: PR Merge → Claude 요약 → Notion 기록 + 마일스톤 업데이트

on:
  pull_request:
    types: [closed]

jobs:
  notify-and-summarize:
    # 실제 머지된 PR만 실행 (Close만 된 PR 제외)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: PR 정보 수집
        id: pr_info
        run: |
          echo "PR 번호: ${{ github.event.pull_request.number }}"
          echo "PR 제목: ${{ github.event.pull_request.title }}"
          echo "머지한 사람: ${{ github.event.pull_request.merged_by.login }}"
          echo "베이스 브랜치: ${{ github.event.pull_request.base.ref }}"
          echo "머지 시각: ${{ github.event.pull_request.merged_at }}"

      # ────────────────────────────────────────
      # STEP 1. Claude API로 PR 내용 요약
      # ────────────────────────────────────────
      - name: Claude로 PR 요약 생성
        id: claude_summary
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_BASE="${{ github.event.pull_request.base.ref }}"
          MERGED_BY="${{ github.event.pull_request.merged_by.login }}"
          MERGED_AT="${{ github.event.pull_request.merged_at }}"
          LABELS="${{ join(github.event.pull_request.labels.*.name, ', ') }}"
          MILESTONE="${{ github.event.pull_request.milestone.title }}"
          REPO="${{ github.repository }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          # Claude API 호출
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "{
              \"model\": \"claude-sonnet-4-20250514\",
              \"max_tokens\": 1024,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": \"아래 GitHub PR 정보를 한국어로 간결하게 요약해줘. 반드시 JSON 형식으로만 응답하고 다른 텍스트는 절대 포함하지 마.\n\n형식:\n{\\\"summary\\\": \\\"3줄 이내 작업 요약\\\", \\\"type\\\": \\\"feat|fix|refactor|docs|chore 중 하나\\\", \\\"impact\\\": \\\"영향 범위 한 줄\\\"}\n\nPR 제목: ${PR_TITLE}\nPR 본문: ${PR_BODY}\n브랜치: ${PR_BASE}\n라벨: ${LABELS}\"
              }]
            }")

          # 응답에서 JSON 파싱
          SUMMARY=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          text = data['content'][0]['text']
          # 마크다운 코드블록 제거
          text = text.replace('\`\`\`json', '').replace('\`\`\`', '').strip()
          parsed = json.loads(text)
          print(parsed['summary'])
          " 2>/dev/null || echo "요약 생성 실패")

          TYPE=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          text = data['content'][0]['text'].replace('\`\`\`json','').replace('\`\`\`','').strip()
          parsed = json.loads(text)
          print(parsed['type'])
          " 2>/dev/null || echo "chore")

          IMPACT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          text = data['content'][0]['text'].replace('\`\`\`json','').replace('\`\`\`','').strip()
          parsed = json.loads(text)
          print(parsed['impact'])
          " 2>/dev/null || echo "-")

          # 이후 step에서 사용할 수 있도록 output 저장
          echo "summary=${SUMMARY}" >> $GITHUB_OUTPUT
          echo "type=${TYPE}" >> $GITHUB_OUTPUT
          echo "impact=${IMPACT}" >> $GITHUB_OUTPUT
          echo "pr_title=${PR_TITLE}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_author=${PR_AUTHOR}" >> $GITHUB_OUTPUT
          echo "merged_by=${MERGED_BY}" >> $GITHUB_OUTPUT
          echo "merged_at=${MERGED_AT}" >> $GITHUB_OUTPUT
          echo "labels=${LABELS}" >> $GITHUB_OUTPUT
          echo "milestone=${MILESTONE}" >> $GITHUB_OUTPUT
          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────
      # STEP 2. Notion DB에 페이지 생성
      # ────────────────────────────────────────
      - name: Notion에 PR 기록 추가
        run: |
          SUMMARY="${{ steps.claude_summary.outputs.summary }}"
          TYPE="${{ steps.claude_summary.outputs.type }}"
          IMPACT="${{ steps.claude_summary.outputs.impact }}"
          PR_TITLE="${{ steps.claude_summary.outputs.pr_title }}"
          PR_NUMBER="${{ steps.claude_summary.outputs.pr_number }}"
          PR_AUTHOR="${{ steps.claude_summary.outputs.pr_author }}"
          MERGED_BY="${{ steps.claude_summary.outputs.merged_by }}"
          MERGED_AT="${{ steps.claude_summary.outputs.merged_at }}"
          LABELS="${{ steps.claude_summary.outputs.labels }}"
          MILESTONE="${{ steps.claude_summary.outputs.milestone }}"
          PR_URL="${{ steps.claude_summary.outputs.pr_url }}"

          # 타입별 이모지 매핑
          case "$TYPE" in
            feat)     EMOJI="✨" ;;
            fix)      EMOJI="🐛" ;;
            refactor) EMOJI="♻️" ;;
            docs)     EMOJI="📝" ;;
            chore)    EMOJI="🔧" ;;
            *)        EMOJI="🔀" ;;
          esac

          curl -s -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer ${{ secrets.NOTION_API_KEY }}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": { \"database_id\": \"${{ secrets.NOTION_DATABASE_ID }}\" },
              \"icon\": { \"emoji\": \"${EMOJI}\" },
              \"properties\": {
                \"이름\": {
                  \"title\": [{ \"text\": { \"content\": \"[#${PR_NUMBER}] ${PR_TITLE}\" } }]
                },
                \"타입\": {
                  \"select\": { \"name\": \"${TYPE}\" }
                },
                \"마일스톤\": {
                  \"rich_text\": [{ \"text\": { \"content\": \"${MILESTONE}\" } }]
                },
                \"작성자\": {
                  \"rich_text\": [{ \"text\": { \"content\": \"${PR_AUTHOR}\" } }]
                },
                \"머지한 사람\": {
                  \"rich_text\": [{ \"text\": { \"content\": \"${MERGED_BY}\" } }]
                },
                \"머지 일시\": {
                  \"date\": { \"start\": \"${MERGED_AT}\" }
                },
                \"라벨\": {
                  \"rich_text\": [{ \"text\": { \"content\": \"${LABELS}\" } }]
                },
                \"PR 링크\": {
                  \"url\": \"${PR_URL}\"
                },
                \"상태\": {
                  \"select\": { \"name\": \"머지 완료\" }
                }
              },
              \"children\": [
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"📋 Claude 요약\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"${SUMMARY}\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"🎯 영향 범위\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"${IMPACT}\" } }]
                  }
                }
              ]
            }"

      # ────────────────────────────────────────
      # STEP 3. 마일스톤 진행률 확인 및 코멘트
      # ────────────────────────────────────────
      - name: 마일스톤 진행률 업데이트
        if: github.event.pull_request.milestone != null
        run: |
          MILESTONE_NUMBER="${{ github.event.pull_request.milestone.number }}"
          MILESTONE_TITLE="${{ github.event.pull_request.milestone.title }}"
          REPO="${{ github.repository }}"

          # 마일스톤 상세 정보 가져오기 (open/closed 이슈 수)
          MILESTONE_DATA=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/milestones/${MILESTONE_NUMBER}")

          OPEN_ISSUES=$(echo "$MILESTONE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['open_issues'])")
          CLOSED_ISSUES=$(echo "$MILESTONE_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['closed_issues'])")
          TOTAL=$((OPEN_ISSUES + CLOSED_ISSUES))

          if [ "$TOTAL" -gt 0 ]; then
            PROGRESS=$((CLOSED_ISSUES * 100 / TOTAL))
          else
            PROGRESS=0
          fi

          # 진행률 바 생성
          FILLED=$((PROGRESS / 10))
          EMPTY=$((10 - FILLED))
          BAR=$(python3 -c "print('█' * ${FILLED} + '░' * ${EMPTY})")

          # PR에 마일스톤 진행률 코멘트 작성
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{
              \"body\": \"## 🎯 마일스톤 진행률 업데이트\n\n**${MILESTONE_TITLE}**\n\n\`${BAR}\` **${PROGRESS}%**\n\n- ✅ 완료: ${CLOSED_ISSUES}개\n- 🔄 진행중: ${OPEN_ISSUES}개\n- 📊 전체: ${TOTAL}개\n\n---\n*이 코멘트는 자동으로 생성되었습니다.*\"
            }"

          # 마일스톤 100% 완료 시 자동 Close
          if [ "$PROGRESS" -eq 100 ]; then
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/milestones/${MILESTONE_NUMBER}" \
              -d "{\"state\": \"closed\"}"
            echo "✅ 마일스톤 '${MILESTONE_TITLE}' 100% 완료 → 자동 Close"
          fi
