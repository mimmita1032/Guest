name: PR Merge → Claude 요약 → Notion 기록 + 마일스톤 업데이트

on:
  pull_request:
    types: [closed]

jobs:
  notify-and-summarize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # ────────────────────────────────────────
      # STEP 1. Claude Code Action으로 PR 요약
      #   인증은 Pro/Max 구독의 OAuth 토큰을 쓴다 (API 크레딧 불필요).
      #   토큰은 로컬에서 `claude setup-token`으로 발급해 리포지토리 시크릿
      #   CLAUDE_CODE_OAUTH_TOKEN 에 넣어둔다.
      # ────────────────────────────────────────
      - name: Claude 요약 생성
        id: summarize
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            아래 GitHub PR을 한국어로 요약해라. 저장소를 뒤지지 말고 주어진 정보만으로 판단해라.

            - summary: 무엇을 왜 했는지 3줄 이내. 파일 목록 나열이 아니라 의도를 쓴다
            - type: feat | fix | refactor | docs | chore 중 하나.
              제목에 접두사가 있으면 그것을 따르고, 없으면 내용으로 판단한다
            - impact: 영향 범위 한 줄

            PR 제목: ${{ github.event.pull_request.title }}
            브랜치: ${{ github.event.pull_request.base.ref }}
            라벨: ${{ join(github.event.pull_request.labels.*.name, ', ') }}

            PR 본문:
            ${{ github.event.pull_request.body }}
          claude_args: |
            --max-turns 1
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"},"type":{"type":"string","enum":["feat","fix","refactor","docs","chore"]},"impact":{"type":"string"}},"required":["summary","type","impact"],"additionalProperties":false}'

      # ────────────────────────────────────────
      # STEP 2. Notion 기록
      #   요약이 실패해도 기록 자체는 남긴다 — 폴백값이 들어갈 뿐이다.
      # ────────────────────────────────────────
      - name: Notion 기록
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CLAUDE_OUTPUT: ${{ steps.summarize.outputs.structured_output }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
          MILESTONE: ${{ github.event.pull_request.milestone.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 << 'PYTHON_EOF'
          import os, json, urllib.request, urllib.error

          notion_key   = os.environ.get("NOTION_API_KEY", "")
          notion_db_id = os.environ.get("NOTION_DATABASE_ID", "")
          pr_title     = os.environ.get("PR_TITLE", "")
          pr_number    = os.environ.get("PR_NUMBER", "")
          pr_author    = os.environ.get("PR_AUTHOR", "")
          merged_by    = os.environ.get("MERGED_BY", "")
          merged_at    = os.environ.get("MERGED_AT", "")
          labels       = os.environ.get("LABELS", "")
          milestone    = os.environ.get("MILESTONE", "")
          pr_url       = os.environ.get("PR_URL", "")

          # ── Claude 요약 파싱 ──
          # 요약 스텝이 실패하면 structured_output이 비어 온다. 그때는
          # 제목 접두사(feat: / fix: ...)로 타입을 뽑아 최소한의 값은 채운다.
          summary = ""
          pr_type = ""
          impact  = "-"

          raw = os.environ.get("CLAUDE_OUTPUT", "").strip()
          if raw:
              try:
                  parsed  = json.loads(raw)
                  summary = parsed.get("summary", "")
                  pr_type = parsed.get("type", "")
                  impact  = parsed.get("impact", "-")
                  print(f"Claude 요약 완료: {summary}")
              except json.JSONDecodeError as e:
                  print(f"Claude 출력 파싱 실패: {e}\n원본: {raw[:500]}")
          else:
              print("Claude 요약 스텝이 결과를 내지 못했다 — 제목 접두사로 대체한다")

          # ── 폴백: 제목 접두사에서 타입 추출 ──
          VALID_TYPES = ("feat", "fix", "refactor", "docs", "chore", "perf", "test", "style")
          if pr_type not in VALID_TYPES:
              head = pr_title.split(":", 1)[0].split("(", 1)[0].strip().lower()
              pr_type = head if head in VALID_TYPES else "chore"

          if not summary:
              # 본문 첫 문단이 대체로 요약 역할을 한다
              body = os.environ.get("PR_BODY", "") or pr_title
              summary = next((p.strip() for p in body.split("\n\n") if p.strip()), pr_title)[:1800]

          # Notion rich_text는 블록당 2000자 제한
          summary = summary[:1900]
          impact  = (impact or "-")[:1900]

          emoji_map = {
              "feat": "✨", "fix": "🐛", "refactor": "♻️", "docs": "📝",
              "chore": "🔧", "perf": "⚡", "test": "🧪", "style": "💄",
          }
          emoji = emoji_map.get(pr_type, "🔀")

          # ── Notion 페이지 생성 ──
          print("Notion 페이지 생성 중...")
          notion_payload = {
              "parent": {"database_id": notion_db_id},
              "icon": {"emoji": emoji},
              "properties": {
                  "이름":        {"title":     [{"text": {"content": f"[#{pr_number}] {pr_title}"[:2000]}}]},
                  "타입":        {"select":    {"name": pr_type}},
                  "마일스톤":    {"rich_text": [{"text": {"content": milestone}}]},
                  "작성자":      {"rich_text": [{"text": {"content": pr_author}}]},
                  "머지한 사람": {"rich_text": [{"text": {"content": merged_by}}]},
                  "머지 일시":   {"date":      {"start": merged_at}},
                  "라벨":        {"rich_text": [{"text": {"content": labels}}]},
                  "PR 링크":     {"url":       pr_url},
                  "상태":        {"select":    {"name": "머지 완료"}},
              },
              "children": [
                  {"object": "block", "type": "heading_2",
                   "heading_2": {"rich_text": [{"text": {"content": "📋 요약"}}]}},
                  {"object": "block", "type": "paragraph",
                   "paragraph": {"rich_text": [{"text": {"content": summary}}]}},
                  {"object": "block", "type": "heading_2",
                   "heading_2": {"rich_text": [{"text": {"content": "🎯 영향 범위"}}]}},
                  {"object": "block", "type": "paragraph",
                   "paragraph": {"rich_text": [{"text": {"content": impact}}]}},
              ],
          }

          try:
              req = urllib.request.Request(
                  "https://api.notion.com/v1/pages",
                  data=json.dumps(notion_payload).encode(),
                  headers={
                      "Authorization": f"Bearer {notion_key}",
                      "Notion-Version": "2022-06-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  notion_data = json.loads(resp.read())
              print(f"✅ Notion 페이지 생성 완료: {notion_data.get('url', '')}")
          except urllib.error.HTTPError as e:
              print(f"Notion API 오류 ({e.code}): {e.read().decode('utf-8', 'replace')}")
              raise
          except Exception as e:
              print(f"Notion 오류: {type(e).__name__}: {e}")
              raise

          PYTHON_EOF

      # ────────────────────────────────────────
      # STEP 3. 마일스톤 진행률 확인 및 코멘트
      # ────────────────────────────────────────
      - name: 마일스톤 진행률 업데이트
        if: github.event.pull_request.milestone != null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ github.event.pull_request.milestone.number }}
          MILESTONE_TITLE: ${{ github.event.pull_request.milestone.title }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'PYTHON_EOF'
          import os, json, urllib.request, urllib.error

          token            = os.environ.get("GITHUB_TOKEN", "")
          milestone_number = os.environ.get("MILESTONE_NUMBER", "")
          milestone_title  = os.environ.get("MILESTONE_TITLE", "")
          repo             = os.environ.get("REPO", "")
          pr_number        = os.environ.get("PR_NUMBER", "")

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # 마일스톤 정보 가져오기
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/milestones/{milestone_number}",
                  headers=headers
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())

              open_issues   = data["open_issues"]
              closed_issues = data["closed_issues"]
              total         = open_issues + closed_issues
              progress      = (closed_issues * 100 // total) if total > 0 else 0

              filled = progress // 10
              bar    = "█" * filled + "░" * (10 - filled)

              comment_body = (
                  f"## 🎯 마일스톤 진행률 업데이트\n\n"
                  f"**{milestone_title}**\n\n"
                  f"`{bar}` **{progress}%**\n\n"
                  f"- ✅ 완료: {closed_issues}개\n"
                  f"- 🔄 진행중: {open_issues}개\n"
                  f"- 📊 전체: {total}개\n\n"
                  f"---\n*이 코멘트는 자동으로 생성되었습니다.*"
              )

              # PR에 코멘트 작성
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
                  data=json.dumps({"body": comment_body}).encode(),
                  headers={**headers, "Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  print(f"✅ 마일스톤 코멘트 작성 완료 ({progress}%)")

              # 100% 완료 시 마일스톤 Close
              if progress == 100:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/milestones/{milestone_number}",
                      data=json.dumps({"state": "closed"}).encode(),
                      method="PATCH",
                      headers={**headers, "Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(req):
                      print(f"✅ 마일스톤 '{milestone_title}' 100% 완료 → 자동 Close")

          except Exception as e:
              print(f"마일스톤 오류: {e}")

          PYTHON_EOF
